backend:
  name: github
  repo: dengbowen666/dengbowen666.github.io
  branch: master
  # Vercel OAuth Proxy：一次登录长期有效，浏览器自动续 token
  # base_url 填 Vercel 部署后的域名（Vercel 项目名变化时同步更新此处）
  base_url: https://decap-oauth-dengbowen.vercel.app
  auth_endpoint: /api/auth

# 站点域名（用于媒体预览绝对路径）
site_url: https://dengbowen666.github.io
# 媒体文件输出目录（public 下 → 部署后 /uploads/*）
media_folder: "src/.vuepress/public/uploads"
public_path: "/uploads"

publish_mode: simple

locale: "zh_Hans"

# 通用：博文 / 笔记类字段（展柜、收藏等正文含 Vue 组件的集合单独定义）
_article_fields: &article_fields
  - { label: "标题", name: "title", widget: "string" }
  - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
  - label: "标签"
    name: "tag"
    widget: "list"
    required: false
  - label: "分类"
    name: "category"
    widget: "list"
    required: false
  - { label: "图标（FontAwesome 名，如 link / timeline / laptop-code）", name: "icon", widget: "string", required: false }
  - { label: "封面图 URL（外链或 /uploads/ 路径）", name: "cover", widget: "string", required: false }
  - { label: "是否草稿", name: "draft", widget: "boolean", default: false, required: false }
  - { label: "是否置顶", name: "sticky", widget: "boolean", default: false, required: false }
  - { label: "星标", name: "star", widget: "boolean", default: false, required: false }
  - { label: "正文", name: "body", widget: "markdown" }

collections:
  # ===== 记录 · 随笔博文（src/posts 根目录，不含“前端”专区）=====
  - name: "posts"
    label: "记录·随笔"
    folder: "src/posts"
    create: true
    # 不开 nested：folder 集合默认只列根目录文章，自然排除“前端”子目录（由 study 集合管理）
    editor:
      preview: false
    sortable_fields: ["title", "date"]
    view_filters:
      - label: "草稿"
        field: draft
        pattern: true
    fields: *article_fields

  # ===== 记录 · 前端学习笔记（含 css / vue / JavaScript 子目录）=====
  - name: "study"
    label: "前端学习笔记"
    folder: "src/posts/前端"
    create: true
    # 递归子目录，可在 css / vue / JavaScript 里新建笔记
    nested:
      depth: 3
    editor:
      preview: false
    sortable_fields: ["title", "date"]
    fields: *article_fields

  # ===== 展柜 · 图集（cosplay / travel，正文为 GalleryCarousel / GalleryGrid 组件）=====
  - name: "gallery"
    label: "展柜·图集"
    folder: "src/gallery"
    create: true
    # 递归 cosplay / travel 子目录，新建时可选择放入哪个图集分类
    nested:
      depth: 3
    editor:
      preview: false
    sortable_fields: ["title", "date"]
    fields:
      - { label: "标题（如：机械朋克少女 / 大理）", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "封面图 URL（列表卡片用，横图 landscape_4_3 最佳）", name: "cover", widget: "string" }
      - label: "图标（FontAwesome 名）"
        name: "icon"
        widget: "select"
        default: "images"
        options:
          - { label: "图片（images）", value: "images" }
          - { label: "面具 Cosplay（mask）", value: "mask" }
          - { label: "机器人（robot）", value: "robot" }
          - { label: "法师帽（hat-wizard）", value: "hat-wizard" }
          - { label: "山川（mountain-sun）", value: "mountain-sun" }
          - { label: "相机（camera-retro）", value: "camera-retro" }
      - label: "正文（图集组件）"
        name: "body"
        widget: "markdown"
        default: |
          ## 图集说明

          在这里写一两句介绍，下方为幻灯片 / 九宫格组件，替换图片 URL、标题、描述即可。

          <GalleryCarousel :slides='[
            {"src":"在此粘贴图片URL","caption":"图1标题","desc":"图1描述"},
            {"src":"在此粘贴图片URL","caption":"图2标题","desc":"图2描述"},
            {"src":"在此粘贴图片URL","caption":"图3标题","desc":"图3描述"},
            {"src":"在此粘贴图片URL","caption":"图4标题","desc":"图4描述"}
          ]' />

          <!-- 旅游九宫格用 GalleryGrid，把上面整段换成：
          <GalleryGrid :items='[
            {"src":"图片URL","caption":"说明"},
            {"src":"图片URL","caption":"说明"}
          ]' />
          -->

  # ===== 收藏（game / movies / music / photos）=====
  - name: "favorite"
    label: "收藏"
    folder: "src/favorite"
    create: true
    nested:
      depth: 3
    editor:
      preview: false
    sortable_fields: ["title"]
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "图标（FontAwesome 名）", name: "icon", widget: "string", required: false }
      - { label: "分类", name: "category", widget: "string", required: false }
      - { label: "正文（Markdown / 组件）", name: "body", widget: "markdown" }

  # ===== 工具（网站推荐 / 常用文档）=====
  - name: "tools"
    label: "工具收藏"
    folder: "src/tools"
    create: true
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "图标（FontAwesome 名，如 link / book）", name: "icon", widget: "string", required: false }
      - { label: "分类（如：导航）", name: "category", widget: "string", required: false }
      - label: "标签"
        name: "tag"
        widget: "list"
        required: false
      - { label: "正文", name: "body", widget: "markdown" }

  # ===== 更新日志 =====
  - name: "changelog"
    label: "更新日志"
    folder: "src/changelog"
    create: true
    editor:
      preview: false
    sortable_fields: ["date"]
    fields:
      - { label: "标题（如：9.1）", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "标签（如：日志）", name: "tag", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  # ===== 独立页面（单文件，不支持新建）=====
  - name: "pages"
    label: "独立页面"
    editor:
      preview: false
    files:
      - name: "intro"
        label: "关于我"
        file: "src/intro.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "头像", name: "avatar", widget: "image", required: false }
          - { label: "头像 Alt", name: "avatarAlt", widget: "string", required: false }
          - { label: "欢迎语", name: "welcome", widget: "string", required: false }
          - { label: "正文", name: "body", widget: "markdown" }
      - name: "home"
        label: "主页配置"
        file: "src/README.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "Hero 文字（打字机效果）", name: "heroText", widget: "string" }
          - { label: "背景图", name: "bgImage", widget: "image", required: false }
          - { label: "页脚", name: "footer", widget: "string", required: false }
          - label: "项目卡片"
            name: "projects"
            widget: "list"
            required: false
            fields:
              - { label: "图标", name: "icon", widget: "string", default: "link" }
              - { label: "名称", name: "name", widget: "string" }
              - { label: "描述", name: "desc", widget: "string" }
              - { label: "链接", name: "link", widget: "string" }
